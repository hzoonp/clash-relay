version: 1

# No URL belongs in this tracked file. secret_name is a logical key resolved
# from CLASH_RELAY_SUBSCRIPTIONS, a same-named environment variable, or an
# ignored local --secret-file.
subscriptions:
  - id: primary
    display_name: 示例订阅源
    enabled: true
    required: true
    secret_name: SUB_PRIMARY
    priority: 100
    on_error: fail
    allowed_uses: [general]
    allowed_countries: [OTHER]
    default_capabilities: [general]
    default_cost_level: standard
    # Optional admission ceiling. Only explicit multiplier markers in node names
    # are evaluated (for example 2x, x2.5, 3倍, 倍率:4). Nodes without an explicit
    # marker are retained. A value of 2.0 rejects only nodes strictly above 2x.
    max_node_multiplier: 2.0
