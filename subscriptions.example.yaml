version: 2

# No URL belongs in this tracked file. secret_name is a logical key resolved
# from CLASH_RELAY_SUBSCRIPTIONS, a same-named environment variable, or an
# ignored local --secret-file. ingest_order is deterministic source ingestion
# order only; it does not rank node quality or routing preference.
subscriptions:
  - id: subscription_1
    display_name: 示例订阅源 1
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_1_URL
    ingest_order: 100
    on_error: skip
    # Optional static request identity for providers that negotiate output by
    # User-Agent. Allowed values are default and mihomo; arbitrary headers are
    # intentionally not accepted.
    client_profile: mihomo
    # Source-level permission boundary: this source may only feed generic web
    # browsing and AI inventories. It cannot enter the general application pool.
    allowed_uses: [browsing, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard
    # Optional admission ceiling. Only explicit multiplier markers in node names
    # are evaluated (for example 2x, x2.5, 3倍, 倍率:4). Nodes without an explicit
    # marker are retained. A value of 2.0 rejects only nodes strictly above 2x.
    max_node_multiplier: 2.0

  - id: subscription_2
    display_name: 示例订阅源 2
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_2_URL
    ingest_order: 200
    on_error: skip
    # Ordinary sources participate in general application and browsing inventories.
    # AI remains isolated to subscription_1 in the canonical production policy.
    allowed_uses: [general, browsing]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard

  - id: subscription_3
    display_name: 示例订阅源 3
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_3_URL
    ingest_order: 300
    on_error: skip
    allowed_uses: [general, browsing]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard

  - id: subscription_4
    display_name: 示例订阅源 4
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_4_URL
    ingest_order: 400
    on_error: skip
    allowed_uses: [general, browsing]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard

  - id: subscription_5
    display_name: 示例订阅源 5
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_5_URL
    ingest_order: 500
    on_error: skip
    allowed_uses: [general, browsing]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard
