version: 1

# No URL belongs in this tracked file. secret_name is a logical key resolved
# from CLASH_RELAY_SUBSCRIPTIONS, a same-named environment variable, or an
# ignored local --secret-file.
subscriptions:
  - id: primary
    display_name: 示例订阅源
    enabled: true
    required: true
    secret_name: SUB_PRIMARY
    priority: 100
    on_error: fail
    allowed_uses: [general]
    allowed_countries: [OTHER]
    default_capabilities: [general]
    default_cost_level: standard
