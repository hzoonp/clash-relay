version: 1

# No URL belongs in this tracked file. Real subscription URLs are resolved from
# CLASH_RELAY_SUBSCRIPTIONS. Subscription declarations are hard source-policy
# boundaries: a node may enter only the inventories named by allowed_uses.
#
# subscription_1 is intentionally constrained to generic web browsing and AI.
# It never enters the general inventory used by media, games, messaging, cloud
# services, fallback routing, or other non-browsing application groups.
subscriptions:
  - id: subscription_1
    display_name: 订阅源 1
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_1_URL
    priority: 100
    on_error: skip
    allowed_uses: [browsing, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard
    # Explicit multiplier markers above 2x are rejected before classification.
    # Exactly 2x and nodes without an explicit multiplier marker are retained.
    max_node_multiplier: 2.0

  - id: subscription_2
    display_name: 订阅源 2
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_2_URL
    priority: 200
    on_error: skip
    allowed_uses: [general, browsing, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard

  - id: subscription_3
    display_name: 订阅源 3
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_3_URL
    priority: 300
    on_error: skip
    allowed_uses: [general, browsing, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard

  - id: subscription_4
    display_name: 订阅源 4
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_4_URL
    priority: 400
    on_error: skip
    allowed_uses: [general, browsing, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard
