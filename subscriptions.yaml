version: 1

# No URL belongs in this tracked file. Real subscription URLs are resolved from
# CLASH_RELAY_SUBSCRIPTIONS. Production uses one shared general node inventory;
# subscription declarations control node admission only and do not rewrite
# canonical non-AI ACL4SSR routing. AI remains permissive at declaration time
# and fail-closed at publication time through live service qualification.
subscriptions:
  - id: subscription_1
    display_name: 订阅源 1
    enabled: true
    required: false
    secret_name: SUBSCRIPTION_1_URL
    priority: 100
    on_error: skip
    allowed_uses: [general, ai]
    allowed_countries: ['*']
    default_capabilities: [general]
    default_cost_level: standard
    # Explicit multiplier markers above 2x are rejected before classification.
    max_node_multiplier: 2.0

  - id: subscription_2
