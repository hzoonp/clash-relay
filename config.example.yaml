version: 2

runtime:
  mixed_port: 7890
  allow_lan: false
  bind_address: 127.0.0.1
  mode: rule
  log_level: warning
  ipv6: false
  unified_delay: true
  tcp_concurrent: true
  profile:
    store_selected: true
    store_fake_ip: false
  dns:
    mode: client
  sniffer:
    enabled: true
    force_dns_mapping: false
    parse_pure_ip: true
    sniff:
      http:
        ports: [80, '8080-8880']
        override_destination: true
      tls:
        ports: [443, 8443]
      quic:
        ports: [443, 8443]

modules:
  general: true

generation:
  minimum_successful_subscriptions: 1
  minimum_usable_nodes: 1
  fetch_timeout_seconds: 20
  max_subscription_bytes: 8388608
  invalid_proxy_policy: skip
  duplicate_policy: keep_first
  allow_http_subscription_urls: false
  allow_file_subscription_urls: false
  reject_private_proxy_hosts: true
  fail_on_required_subscription_error: true
  node_name_prefix: source_id
  generated_header: true

rule_sources:
  acl4ssr:
    enabled: true
    manifest: rules/acl4ssr.yaml

publishing:
  artifact: false
  github_release:
    enabled: false
    allow_sensitive_public_release: false
  gist:
    enabled: false
    allow_sensitive_unlisted_gist: false
  cloudflare_kv:
    enabled: true
    key: production-config
