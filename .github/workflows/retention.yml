name: Apply immutable release retention

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Retain immutable releases first observed within this many days
        required: true
        default: "30"
        type: string
      expected_plan_id:
        description: Exact plan_id from a separately reviewed read-only retention plan
        required: true
        type: string
      confirm:
        description: Delete only immutable release pairs covered by the revalidated plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clash-relay-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate retention executor SHA
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  retention:
    name: Revalidate and apply reviewed retention plan
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.confirm == true && needs.validate.outputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Recreate and verify the reviewed retention plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
          EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          mkdir -p .work/private
          clash-relay plan-release-retention --retention-days "$RETENTION_DAYS" > .work/private/retention-plan.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path(".work/private/retention-plan.json").read_text(encoding="utf-8"))
          if plan.get("plan_id") != os.environ["EXPECTED_PLAN_ID"]:
              raise SystemExit("reviewed retention plan is stale or does not match this production state")
          PY
      - name: Apply revalidated immutable release retention
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          clash-relay apply-release-retention \
            --plan .work/private/retention-plan.json \
            --confirm-retention-delete \
            > .work/private/retention-result.json
      - name: Record aggregate retention result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(".work/private/retention-result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  "## Immutable release retention\n\n"
                  f"Deleted release pairs: **{len(result.get('deleted_release_ids', []))}**  \n"
                  f"Deleted immutable objects: **{result.get('deleted_objects', 0)}**\n"
              )
          PY
      - name: Remove private retention material
        if: always()
        run: rm -rf .work/private
