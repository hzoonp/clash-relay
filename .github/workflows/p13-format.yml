name: Format P13 transport module

on:
  push:
    branches:
      - feat/p13-p15-transport-source-health
    paths:
      - ".github/workflows/p13-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p13-p15-transport-source-health
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Format and verify P13 module
        run: |
          set -euo pipefail
          ruff format src/clash_relay/transport_qualification.py
          ruff check .
          ruff format --check .
      - name: Commit formatted module
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/clash_relay/transport_qualification.py; then
            echo "P13 module already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clash_relay/transport_qualification.py
          git commit -m "style: format P13 transport qualification"
          git push origin HEAD:feat/p13-p15-transport-source-health
