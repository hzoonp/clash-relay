name: Apply runtime label compatibility fixes

on:
  push:
    branches:
      - feat/short-runtime-source-labels
    paths:
      - .github/workflows/fix-short-runtime-compat.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/short-runtime-source-labels
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - name: Apply compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_one(
              "src/clash_relay/routing_policy.py",
              '''def _source_exclude_pattern(source_ids: tuple[str, ...]) -> str:\n    alternatives = "|".join(re.escape(runtime_source_label(source_id)) for source_id in source_ids)\n    return rf"^\\[[^\\]]+\\]\\s+(?:{alternatives})/"''',
              '''def _source_exclude_pattern(source_ids: tuple[str, ...]) -> str:\n    labels: list[str] = []\n    for source_id in source_ids:\n        labels.append(source_id)\n        short_label = runtime_source_label(source_id)\n        if short_label != source_id:\n            labels.append(short_label)\n    alternatives = "|".join(re.escape(label) for label in labels)\n    return rf"^\\[[^\\]]+\\]\\s+(?:{alternatives})/"''',
          )
          replace_one(
              "tests/test_cli.py",
              '    assert "1.2.1" in capsys.readouterr().out',
              '    assert "1.4.1" in capsys.readouterr().out',
          )
          PY
          ruff format src/clash_relay/routing_policy.py tests/test_cli.py
      - name: Commit compatibility fixes
        run: |
          rm .github/workflows/fix-short-runtime-compat.yml
          git config user.name "hzoonp"
          git config user.email "59133798+hzoonp@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve long runtime source prefix compatibility"
          git push origin HEAD:feat/short-runtime-source-labels
