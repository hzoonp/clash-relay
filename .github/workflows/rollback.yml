name: Roll back production config

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Replace production-config with the preserved previous validated release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clash-relay-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Audit, validate, and activate previous release
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Enforce Cloudflare-only publication policy
        run: |
          clash-relay publication-gate \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --policies policies.yaml \
            --mode cloudflare_kv

      - name: Fetch private previous release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          mkdir -p .work/private
          python scripts/fetch_previous_config.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --policies policies.yaml \
            --output .work/private/rollback.yaml \
            > .work/private/rollback-source.json

      - name: Audit previous release against current production policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_production.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --policies policies.yaml \
            --candidate .work/private/rollback.yaml \
            > .work/private/rollback-current-policy-audit.json

      - name: Validate previous release with pinned stable Mihomo matrix
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/validate_mihomo_matrix.py \
            --candidate .work/private/rollback.yaml \
            --manifest tools/mihomo-versions.json \
            --channel stable \
            --work-dir .work/bin/rollback-validation \
            > .work/private/rollback-validation-matrix.json \
            2> .work/rollback-validation.error; then
            echo "::error title=Mihomo rollback validation failed::A pinned stable core rejected the preserved previous release. Detailed core output is intentionally suppressed."
            exit 1
          fi

      - name: Activate audited validated previous release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          python scripts/publish_release_bundle.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --policies policies.yaml \
            --candidate .work/private/rollback.yaml \
            > .work/private/rollback-publication.json

      - name: Record rollback result
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          content = Path(".work/private/rollback.yaml").read_bytes()
          with open(".work/private/rollback-validation-matrix.json", encoding="utf-8") as handle:
              cores = json.load(handle).get("validated_cores", [])
          with open(".work/private/rollback-source.json", encoding="utf-8") as handle:
              source = json.load(handle)
          with open(".work/private/rollback-current-policy-audit.json", encoding="utf-8") as handle:
              audit = json.load(handle)
          client_path = audit.get("openai_client_path", {})
          lines = [
              "## Production rollback",
              "",
              "Status: **activated**  ",
              f"Source: **{source.get('source', 'unknown')}**  ",
              f"Bytes: **{len(content)}**  ",
              f"SHA-256: `{hashlib.sha256(content).hexdigest()}`  ",
              f"Validated cores: **{', '.join(cores)}**  ",
              f"OpenAI client-path audit: **{client_path.get('status', 'unknown')}**",
              "",
              "The exact previous release passed the current source isolation, Routing V2, OpenAI App route-lock, OpenAI client-path, and stable Mihomo validation contracts before activation.",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Remove private rollback candidate
        if: always()
        run: rm -rf .work/private
