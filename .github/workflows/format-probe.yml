name: Format probe

on:
  push:
    branches: [agent/p0-admission-provenance]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development tools
        run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - name: Show formatter diff
        run: |
          ruff format --diff tests/test_admission_provenance.py
          exit 1
