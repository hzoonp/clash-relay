name: P10E Format Diff

on:
  push:
    branches: [agent/p10e-coverage-75]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    if: github.event_name == 'push' || github.head_ref == 'agent/p10e-coverage-75'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install formatter
        run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - name: Show exact Ruff format diff
        run: ruff format --diff tests/test_production_pipeline_orchestration.py
