name: P15C formatter diff

on:
  push:
    branches:
      - work/p15c-qualification-failure-boundaries

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - name: Show exact Ruff formatter diff
        run: ruff format --diff tests/test_qualification_failure_boundaries_unit.py || true
