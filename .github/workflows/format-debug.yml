name: Temporary Ruff Format Diff

on:
  push:
    branches: [browsing-regional-scheduling]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.10
      - run: ruff format --diff src/clash_relay/browsing_runtime.py
