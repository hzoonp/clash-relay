name: Temporary formatter diff

on:
  push:
    branches:
      - fix/ai-all-empty-fail-closed
    paths:
      - "src/clash_relay/ai_service_qualification.py"
      - ".github/workflows/temp-format-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - run: ruff format --diff src/clash_relay/ai_service_qualification.py
