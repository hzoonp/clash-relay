name: P52 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "src/clash_relay/**"
      - "tests/**"
      - "policies/**"
      - "schemas/**"
      - ".github/workflows/p52-diagnostic.yml"

permissions:
  contents: read

jobs:
  test-range:
    name: Tests ${{ matrix.range }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - range: a-f
            pattern: "test_[a-f]*.py"
          - range: g-m
            pattern: "test_[g-m]*.py"
          - range: n-s
            pattern: "test_[n-s]*.py"
          - range: t-z
            pattern: "test_[t-z]*.py"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Run test range
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '${{ matrix.pattern }}' -print | sort)
          test "${#files[@]}" -gt 0
          pytest -q "${files[@]}"
