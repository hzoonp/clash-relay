name: P52 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "src/clash_relay/**"
      - "tests/**"
      - "policies/**"
      - "schemas/**"
      - ".github/workflows/p52-diagnostic.yml"

permissions:
  contents: read

jobs:
  focused-test:
    name: ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_service_qualification.py
          - tests/test_qualification_pipeline.py
          - tests/test_openai_app_release_contract.py
          - tests/test_ai_qualification.py
          - tests/test_ai_qualification_cache.py
          - tests/test_ai_region_preference.py
          - tests/test_ai_runtime_reliability.py
          - tests/test_ai_service_qualification.py
          - tests/test_config_loader.py
          - tests/test_production_pipeline.py
          - tests/test_repository_safety.py
          - tests/test_security_policy.py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Run focused test file
        run: pytest -q "${{ matrix.test_file }}"
