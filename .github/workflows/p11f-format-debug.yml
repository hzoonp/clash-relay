name: P11F formatter diff

on:
  push:
    branches:
      - agent/p11f-generator-decomposition

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - run: ruff format --diff src/clash_relay/rule_compiler.py
