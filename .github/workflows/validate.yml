name: Validate commit

on:
  workflow_call:
    outputs:
      validated_sha:
        description: Exact commit SHA that completed every required validation gate
        value: ${{ jobs.validated.outputs.sha }}

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify fork public readiness
        run: clash-relay doctor --public-only
      - name: Audit authoritative documentation contract
        run: python scripts/audit_documentation_contract.py
      - name: Audit architecture contract
        run: python scripts/audit_architecture_contract.py
      - name: Audit operational SLO contract
        run: python scripts/audit_operational_slo_contract.py
      - name: Audit service qualification contract
        run: python scripts/audit_service_qualification_contract.py
      - name: Audit v2 release contract
        run: python scripts/audit_v2_release_contract.py
      - name: Audit supply-chain contract
        run: python scripts/audit_supply_chain.py
      - run: ruff check .
      - run: ruff format --check .
      - name: Static type gate for core and application boundaries
        run: |
          mypy --follow-imports=skip --ignore-missing-imports --check-untyped-defs \
            src/clash_relay/builder.py \
            src/clash_relay/classify.py \
            src/clash_relay/config_loader.py \
            src/clash_relay/node_policy.py \
            src/clash_relay/selector.py \
            src/clash_relay/policy_compiler.py \
            src/clash_relay/runtime_graph.py \
            src/clash_relay/availability.py \
            src/clash_relay/service_qualification.py \
            src/clash_relay/service_qualification_result.py \
            src/clash_relay/ai_application.py \
            src/clash_relay/qualification_pipeline.py \
            src/clash_relay/production_application.py \
            src/clash_relay/production_pipeline.py \
            src/clash_relay/promotion_guard.py \
            src/clash_relay/production_release_stage.py \
            src/clash_relay/operational_slo.py \
            src/clash_relay/slo_application.py \
            src/clash_relay/production_lifecycle.py
      - name: Unit tests and coverage floor
        run: |
          pytest -m "not integration" \
            --cov=clash_relay \
            --cov-fail-under=73 \
            --cov-report=term-missing \
            --cov-report=xml:.work/coverage-3.12.xml \
            --junitxml=.work/unit-3.12.xml
      - run: python scripts/repository_audit.py

  python-compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Run compatibility-critical tests
        run: |
          pytest -m "not integration" \
            tests/test_config_loader.py \
            tests/test_generation.py \
            tests/test_subscription_parser.py \
            tests/test_subscription_policy.py \
            tests/test_validator.py \
            --junitxml=.work/compat-${{ matrix.python }}.xml

  deterministic-generation:
    name: Deterministic fictional generation
    needs: [quality, python-compat]
    runs-on: ubuntu-latest
    outputs:
      mihomo_tags: ${{ steps.versions.outputs.tags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - id: versions
        name: Export pinned stable Mihomo matrix
        run: python scripts/export_mihomo_matrix.py --channel stable --github-output "$GITHUB_OUTPUT"
      - name: Verify pinned ACL4SSR Online fidelity
        run: python scripts/audit_acl4ssr_fidelity.py
      - run: python scripts/make_fixture_sources.py
      - name: Generate twice and compare bytes
        run: |
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --report .work/first.json
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/second.yaml
          cmp .work/first.yaml .work/second.yaml
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --check

  stable-mihomo:
    name: Mihomo ${{ matrix.tag }}
    needs: deterministic-generation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.deterministic-generation.outputs.mihomo_tags) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Download and verify official Mihomo asset
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --tag "${{ matrix.tag }}" \
            --output .work/bin/mihomo
      - run: python scripts/make_fixture_sources.py
      - name: Generate, core-validate, then write
        run: |
          clash-relay build \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --mihomo-bin .work/bin/mihomo \
            --output .work/config.yaml \
            --report .work/build.json
      - name: Real startup and provider HEAD integration tests
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.work/bin/mihomo
        run: |
          pytest -m integration tests/integration \
            --ignore=tests/integration/test_acl4ssr_upstream.py \
            --junitxml=.work/integration-${{ matrix.tag }}.xml
          for attempt in 1 2 3; do
            if pytest -m integration tests/integration/test_acl4ssr_upstream.py \
              --junitxml=.work/integration-acl4ssr-${{ matrix.tag }}.xml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$attempt"
          done

  validated:
    name: Validated SHA
    needs: [quality, python-compat, deterministic-generation, stable-mihomo]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        name: Bind validation result to exact commit SHA
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
