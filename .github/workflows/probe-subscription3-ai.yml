name: Probe subscription 3 AI reachability

on:
  push:
    branches:
      - diagnostic/subscription3-ai-probe
    paths:
      - "scripts/probe_subscription_ai.py"
      - ".github/workflows/probe-subscription3-ai.yml"

permissions:
  contents: read

concurrency:
  group: subscription3-ai-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Private AI egress probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock --editable .

      - name: Mask individual subscription URLs
        shell: bash
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          python - <<'PY'
          import os
          from clash_relay.secrets import load_secret_mapping

          def command_escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for value in load_secret_mapping(env=os.environ).values():
              print(f"::add-mask::{command_escape(value)}")
          PY

      - name: Build anonymous raw subscription 3 probe config
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          mkdir -p .work/private
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          from clash_relay.fetch import fetch_subscription
          from clash_relay.secrets import load_secret_mapping
          from clash_relay.subscription_parser import parse_subscription

          mapping = load_secret_mapping(env=os.environ)
          url = mapping["SUBSCRIPTION_3_URL"]
          text = fetch_subscription(
              url,
              timeout=20,
              max_bytes=8388608,
              allow_http=False,
              allow_file=False,
          )
          parsed = parse_subscription(
              text,
              invalid_policy="error",
              reject_private_hosts=True,
          )

          proxies = []
          for index, proxy in enumerate(parsed.proxies, start=1):
              anonymous = dict(proxy)
              anonymous["name"] = f"probe-{index:04d}"
              proxies.append(anonymous)

          print(f"subscription_3_raw_nodes={len(proxies)}")
          print(f"subscription_3_skipped_invalid={parsed.skipped_items}")
          if not proxies:
              raise SystemExit("subscription 3 has no usable raw proxy nodes")

          document = {
              "mixed-port": 17890,
              "allow-lan": False,
              "bind-address": "127.0.0.1",
              "mode": "rule",
              "log-level": "error",
              "ipv6": False,
              "profile": {"store-selected": False, "store-fake-ip": False},
              "external-controller": "127.0.0.1:19090",
              "secret": "local-probe-only",
              "dns": {
                  "enable": True,
                  "enhanced-mode": "fake-ip",
                  "listen": "127.0.0.1:1153",
                  "nameserver": [
                      "https://1.1.1.1/dns-query",
                      "https://8.8.8.8/dns-query",
                  ],
                  "fallback": ["tls://1.0.0.1:853"],
              },
              "proxy-providers": {
                  "probe_subscription_3": {
                      "type": "inline",
                      "payload": proxies,
                  }
              },
              "proxy-groups": [
                  {
                      "name": "__AI_PROBE_RAW",
                      "type": "select",
                      "hidden": True,
                      "use": ["probe_subscription_3"],
                  }
              ],
              "rules": ["MATCH,__AI_PROBE_RAW"],
          }
          Path(".work/private/probe.yaml").write_text(
              yaml.safe_dump(document, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Download pinned Mihomo
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --tag v1.19.30 \
            --output .work/bin/mihomo-1.19.30 \
            > .work/private/mihomo-download.json

      - name: Probe subscription 3 through real Mihomo nodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/private/mihomo-home
          .work/bin/mihomo-1.19.30 \
            -d .work/private/mihomo-home \
            -f .work/private/probe.yaml \
            > .work/private/mihomo.log 2>&1 &
          mihomo_pid=$!
          trap 'kill "$mihomo_pid" 2>/dev/null || true' EXIT

          python scripts/probe_subscription_ai.py \
            --candidate .work/private/probe.yaml \
            --source-id subscription_3 \
            --provider probe_subscription_3 \
            --group __AI_PROBE_RAW \
            --timeout 4.0

      - name: Remove all private probe material
        if: always()
        run: rm -rf .work/private
