name: Probe subscription 3 AI reachability

on:
  push:
    branches:
      - diagnostic/subscription3-ai-probe
    paths:
      - "scripts/probe_subscription_ai.py"
      - ".github/workflows/probe-subscription3-ai.yml"

permissions:
  contents: read

concurrency:
  group: subscription3-ai-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Private AI egress probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock --editable .

      - name: Mask individual subscription URLs
        shell: bash
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          python - <<'PY'
          import os
          from clash_relay.secrets import load_secret_mapping

          def command_escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for value in load_secret_mapping(env=os.environ).values():
              print(f"::add-mask::{command_escape(value)}")
          PY

      - name: Generate private production-equivalent candidate
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          mkdir -p .work/private
          clash-relay generate \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --output .work/private/config.yaml \
            --report .work/private/build-report.json \
            > .work/private/generation-summary.json

      - name: Download pinned Mihomo
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --tag v1.19.30 \
            --output .work/bin/mihomo-1.19.30 \
            > .work/private/mihomo-download.json

      - name: Prepare local-only probe runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".work/private/config.yaml")
          target = Path(".work/private/probe.yaml")
          document = yaml.safe_load(source.read_text(encoding="utf-8"))
          document["mixed-port"] = 17890
          document["bind-address"] = "127.0.0.1"
          document["allow-lan"] = False
          document["external-controller"] = "127.0.0.1:19090"
          document["secret"] = "local-probe-only"
          document["log-level"] = "error"
          document.setdefault("profile", {})["store-selected"] = False
          if isinstance(document.get("dns"), dict):
              document["dns"]["listen"] = "127.0.0.1:1153"

          document.setdefault("proxy-groups", []).append(
              {
                  "name": "__AI_PROBE_RAW",
                  "type": "select",
                  "hidden": True,
                  "use": ["cr_general_any"],
              }
          )
          probe_rules = [
              "DOMAIN,api.openai.com,__AI_PROBE_RAW",
              "DOMAIN,api.anthropic.com,__AI_PROBE_RAW",
              "DOMAIN,generativelanguage.googleapis.com,__AI_PROBE_RAW",
          ]
          document["rules"] = probe_rules + list(document.get("rules", []))

          target.write_text(
              yaml.safe_dump(document, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Probe subscription 3 through real Mihomo nodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/private/mihomo-home
          .work/bin/mihomo-1.19.30 \
            -d .work/private/mihomo-home \
            -f .work/private/probe.yaml \
            > .work/private/mihomo.log 2>&1 &
          mihomo_pid=$!
          trap 'kill "$mihomo_pid" 2>/dev/null || true' EXIT

          python scripts/probe_subscription_ai.py \
            --candidate .work/private/config.yaml \
            --source-id subscription_3 \
            --group __AI_PROBE_RAW \
            --timeout 4.0

      - name: Remove all private probe material
        if: always()
        run: rm -rf .work/private
