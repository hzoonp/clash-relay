name: Generate, validate, and publish

on:
  push:
    branches:
      - main
    paths:
      - "config.yaml"
      - "subscriptions.yaml"
      - "services.yaml"
      - "policies.yaml"
      - "rules/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "requirements.lock"
      - "tools/mihomo-versions.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated candidate to Cloudflare KV
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clash-relay-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check production declarations
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        name: Detect canonical user declarations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f config.yaml && -f subscriptions.yaml ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publication skipped until config.yaml and subscriptions.yaml are committed."
          fi

  deploy:
    name: Build, qualify, validate, and optionally publish private config
    needs: prepare
    if: needs.prepare.outputs.configured == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock --editable .

      - name: Enforce Cloudflare-only publication policy
        run: |
          clash-relay publication-gate \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --mode cloudflare_kv

      - name: Mask individual subscription URLs
        shell: bash
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          python - <<'PY'
          import os
          from clash_relay.secrets import load_secret_mapping

          def command_escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for value in load_secret_mapping(env=os.environ).values():
              print(f"::add-mask::{command_escape(value)}")
          PY

      - name: Generate private candidate
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: |
          mkdir -p .work/private
          clash-relay generate \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --output .work/private/generated.yaml \
            --report .work/private/build-report.json \
            > .work/private/generation-summary.json

      - name: Audit source-to-scenario isolation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_production.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --candidate .work/private/generated.yaml \
            --report .work/private/build-report.json \
            --markdown .work/private/production-summary.md \
            > .work/private/production-audit.json
          cat .work/private/production-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Load private scheduler history
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          set -euo pipefail
          python scripts/load_scheduler_history.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --output .work/private/scheduler-history.json \
            --fingerprint-key-output .work/private/scheduler-history.key \
            > .work/private/scheduler-history-load.json

      - name: Load private AI qualification cache
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          set -euo pipefail
          python scripts/load_ai_qualification_cache.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --output .work/private/ai-qualification-cache.json \
            --fingerprint-key-output .work/private/ai-qualification-cache.key \
            > .work/private/ai-qualification-cache-load.json

      - name: Download primary pinned Mihomo for private qualification
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --output .work/bin/mihomo-qualification \
            > .work/download-qualification.json

      - name: Qualify private candidate through the unified pipeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify_candidate.py \
            --candidate .work/private/generated.yaml \
            --output .work/private/config.yaml \
            --policies policies.yaml \
            --mihomo-bin .work/bin/mihomo-qualification \
            --stage-dir .work/private/stages \
            --browsing-report .work/private/browsing-qualification-summary.json \
            --ai-report .work/private/ai-qualification-summary.json \
            --history .work/private/scheduler-history.json \
            --history-key .work/private/scheduler-history.key \
            --next-history .work/private/scheduler-history-next.json \
            --cache .work/private/ai-qualification-cache.json \
            --cache-key .work/private/ai-qualification-cache.key \
            --next-cache .work/private/ai-qualification-cache-next.json \
            | tee .work/private/qualification-pipeline-summary.json

      - name: Append safe browsing qualification summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = ".work/private/browsing-qualification-summary.json"
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          diagnostics = data.get("diagnostics", {})
          latency = diagnostics.get("qualified_latency_ms", {})
          history = data.get("scheduler_history", {})
          lines = [
              "## Browsing qualification",
              "",
              f"Tested nodes: **{int(diagnostics.get('tested_nodes', 0))}**  ",
              f"Qualified nodes: **{int(diagnostics.get('qualified_nodes', 0))}**  ",
              f"Stable / reserve: **{int(data.get('stable_nodes', 0))} / {int(data.get('reserve_nodes', 0))}**  ",
              f"Automatic nodes: **{int(data.get('automatic_nodes', 0))}**  ",
              f"Historically demoted stable nodes: **{int(history.get('historically_demoted_nodes', 0))}**  ",
              f"Scheduler history: **{history.get('status', 'disabled')}** ({int(history.get('records_before', 0))} → {int(history.get('records_after', 0))} anonymous records)  ",
              f"Rejected nodes: **{int(diagnostics.get('failed_nodes', 0))}**  ",
              f"Qualification threshold: **{int(diagnostics.get('required_successes', 0))}/{int(diagnostics.get('attempts_per_node', 0))} successful HTTPS probes**",
              "",
              "| Qualified latency | ms |",
              "| --- | ---: |",
              f"| p50 | {latency.get('p50', 'n/a')} |",
              f"| p95 | {latency.get('p95', 'n/a')} |",
              "",
              "Only aggregate browsing qualification and anonymous-history counts are shown; node-level results remain private.",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Append safe AI qualification summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = ".work/private/ai-qualification-summary.json"
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          diagnostics = data.get("diagnostics", {})
          probes = diagnostics.get("probes", {})
          cache = data.get("qualification_cache", {})
          lines = [
              "## AI qualification",
              "",
              f"Candidate nodes: **{int(diagnostics.get('tested_nodes', 0))}**  ",
              f"Live service probes: **{int(cache.get('live_service_probes', 0))}**  ",
              f"Fresh cache pass/fail hits: **{int(cache.get('cache_pass_hits', 0))} / {int(cache.get('cache_fail_hits', 0))}**  ",
              f"Selector failures: **{int(diagnostics.get('selector_failures', 0))}**",
              "",
              "| Service probe | Live tested | Qualified nodes |",
              "| --- | ---: | ---: |",
          ]
          for name in sorted(probes):
              summary = probes[name]
              lines.append(
                  f"| `{name}` | {int(summary.get('live_tested_nodes', 0))} | {int(summary.get('qualified_nodes', 0))} |"
              )
          lines.extend([
              "",
              "Only aggregate qualification/cache counts are shown; node-level results remain private.",
              "",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Re-audit qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_production.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --candidate .work/private/config.yaml \
            --report .work/private/build-report.json \
            > .work/private/post-qualification-audit.json

      - name: Validate exact qualified candidate with the pinned stable Mihomo matrix
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/validate_mihomo_matrix.py \
            --candidate .work/private/config.yaml \
            --manifest tools/mihomo-versions.json \
            --channel stable \
            --work-dir .work/bin/validation \
            --reuse-primary-bin .work/bin/mihomo-qualification \
            > .work/private/mihomo-validation-matrix.json \
            2> .work/mihomo-validation-matrix.error; then
            echo "::error title=Mihomo validation failed::A pinned stable core rejected the qualified private configuration. Detailed core output is intentionally suppressed in this public repository."
            exit 1
          fi

      - name: Record dry-run result
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_production_proof.py \
            --candidate .work/private/config.yaml \
            --audit .work/private/post-qualification-audit.json \
            --browsing .work/private/browsing-qualification-summary.json \
            --ai .work/private/ai-qualification-summary.json \
            --qualification .work/private/qualification-pipeline-summary.json \
            --validated-cores-report .work/private/mihomo-validation-matrix.json \
            --publication-status dry-run \
            --markdown .work/private/production-proof.md \
            > .work/private/production-proof.json
          cat .work/private/production-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish versioned validated release transaction
        id: publish-release
        if: github.event_name == 'push' || inputs.publish == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          python scripts/publish_release_bundle.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --candidate .work/private/config.yaml \
            > .work/private/release-publication.json

      - name: Persist private AI qualification cache
        id: persist-ai
        if: github.event_name == 'push' || inputs.publish == true
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          python scripts/publish_ai_qualification_cache.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --state .work/private/ai-qualification-cache-next.json \
            > .work/private/ai-qualification-cache-publish.json

      - name: Persist private scheduler history
        id: persist-history
        if: github.event_name == 'push' || inputs.publish == true
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          python scripts/publish_scheduler_history.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --state .work/private/scheduler-history-next.json \
            > .work/private/scheduler-history-publish.json

      - name: Record best-effort state warning
        if: >-
          (github.event_name == 'push' || inputs.publish == true) &&
          (steps.persist-ai.outcome == 'failure' || steps.persist-history.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning title=Derived state persistence::Production release is committed, but one or more optional cache/history writes failed. The next run will recover by probing again."
          printf '%s\n' '## Derived state persistence' '' 'Production config is committed. One or more optional cache/history writes failed and will be rebuilt by later qualification runs.' '' >> "$GITHUB_STEP_SUMMARY"

      - name: Record publication result
        if: github.event_name == 'push' || inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_production_proof.py \
            --candidate .work/private/config.yaml \
            --audit .work/private/post-qualification-audit.json \
            --browsing .work/private/browsing-qualification-summary.json \
            --ai .work/private/ai-qualification-summary.json \
            --qualification .work/private/qualification-pipeline-summary.json \
            --release .work/private/release-publication.json \
            --validated-cores-report .work/private/mihomo-validation-matrix.json \
            --publication-status published \
            --markdown .work/private/production-proof.md \
            > .work/private/production-proof.json
          cat .work/private/production-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private candidate
        if: always()
        run: rm -rf .work/private
