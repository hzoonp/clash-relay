name: Generate, validate, and publish

on:
  push:
    branches:
      - main
    paths:
      - "config.yaml"
      - "subscriptions.yaml"
      - "policies.yaml"
      - "policies/**"
      - "promotion-guard.yaml"
      - "rules/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "requirements.lock"
      - "tools/mihomo-versions.json"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated candidate to Cloudflare KV
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: clash-relay-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Run canonical production lifecycle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock --editable .

      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py

      - name: Run production pipeline
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_MANUAL_PUBLISH: ${{ inputs.publish }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: python scripts/run_production_release.py
