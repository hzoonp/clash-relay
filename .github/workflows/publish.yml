name: Generate, validate, and publish
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated candidate to Cloudflare KV
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'push' && format('clash-relay-production-preflight-{0}', github.ref)
      || ((github.event_name == 'workflow_dispatch' && inputs.publish == true)
      || (github.event_name == 'schedule' && (vars.CLASH_RELAY_SCHEDULE_PUBLISH == 'true' || (github.repository == 'hzoonp/clash-relay' && vars.CLASH_RELAY_SCHEDULE_PUBLISH == ''))))
      && format('clash-relay-production-commit-{0}', github.ref)
      || format('clash-relay-production-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  validate:
    name: Validate production SHA
    uses: ./.github/workflows/ci.yml
    with:
      reuse_main_validation: ${{ github.event_name != 'push' }}
    permissions:
      actions: read
      contents: read

  deploy:
    name: Run canonical production lifecycle
    needs: validate
    if: >-
      github.event_name != 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.outputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py

      - name: Run production pipeline
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_MANUAL_PUBLISH: ${{ inputs.publish }}
          CLASH_RELAY_SCHEDULE_PUBLISH: ${{ github.event_name == 'schedule' && (vars.CLASH_RELAY_SCHEDULE_PUBLISH == 'true' || (github.repository == 'hzoonp/clash-relay' && vars.CLASH_RELAY_SCHEDULE_PUBLISH == '')) }}
          CLASH_RELAY_VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: python scripts/run_production_release.py
