name: Fix P39-P45 validation once

on:
  push:
    branches:
      - feat/p39-p45-production-stabilization
    paths:
      - .github/workflows/fix-p39-p45-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Apply deterministic P39-P45 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:60]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/clash_relay/production_metrics.py",
              '''def _clean_qualification(value: Any) -> dict[str, Any] | None:
              if not isinstance(value, dict):
                  return None
              status = value.get("status")
              if status != "qualified":
                  return None
              stages = value.get("stages")
              stage_count = len(stages) if isinstance(stages, list) else 0
              clean: dict[str, Any] = {"status": "qualified", "stage_count": stage_count}
              browsing = value.get("browsing")
              if isinstance(browsing, dict):
                  attempts = max(1, _non_negative_int(browsing.get("stage_attempts"), 1))
                  clean["browsing_attempts"] = attempts
                  clean["recovered_by_retry"] = browsing.get("recovered_by_retry") is True
                  category = browsing.get("recovered_failure_category")
                  if isinstance(category, str) and category in _FAILURE_CATEGORIES:
                      clean["recovered_failure_category"] = category
              return clean
          ''',
              '''def _clean_qualification(value: Any) -> dict[str, Any] | None:
              if not isinstance(value, dict):
                  return None
              status = value.get("status")
              if status != "qualified":
                  return None
              stages = value.get("stages")
              stage_count = (
                  len(stages)
                  if isinstance(stages, list)
                  else _non_negative_int(value.get("stage_count"))
              )
              clean: dict[str, Any] = {"status": "qualified", "stage_count": stage_count}
              browsing = value.get("browsing")
              if isinstance(browsing, dict):
                  attempts = max(1, _non_negative_int(browsing.get("stage_attempts"), 1))
                  recovered = browsing.get("recovered_by_retry") is True
                  category = browsing.get("recovered_failure_category")
                  has_reliability = True
              else:
                  attempts = max(1, _non_negative_int(value.get("browsing_attempts"), 1))
                  recovered = value.get("recovered_by_retry") is True
                  category = value.get("recovered_failure_category")
                  has_reliability = (
                      "browsing_attempts" in value
                      or "recovered_by_retry" in value
                      or "recovered_failure_category" in value
                  )
              if has_reliability:
                  clean["browsing_attempts"] = attempts
                  clean["recovered_by_retry"] = recovered
                  if isinstance(category, str) and category in _FAILURE_CATEGORIES:
                      clean["recovered_failure_category"] = category
              return clean
          ''',
          )

          replace_once(
              "tests/test_p43_chaos_matrix.py",
              'secret_url = "https://example.com/subscription?token=SUPER-SECRET-TOKEN"',
              'secret_url = "https://example.com/subscription/SUPER-SECRET-TOKEN"',
          )
          replace_once(
              "tests/test_v1_contract.py",
              'assert project["version"] == "1.8.0"',
              'assert project["version"] == "1.8.1"',
          )
          replace_once(
              "tests/test_v1_contract.py",
              'assert "## [1.8.0] - 2026-09-04" in changelog',
              'assert "## [1.8.1] - 2026-09-04" in changelog',
          )

          replace_once(
              "tests/test_publish_trigger.py",
              '        "proof = self._render_existing_proof(release=release)",',
              '        "proof = self._post_commit_proof(release=release)",',
          )
          replace_once(
              "tests/test_publish_trigger.py",
              '        "manifest = self._render_release_manifest(",',
              '        "manifest = self._post_commit_manifest(",\n        "metrics = self._persist_production_metrics()",',
          )
          replace_once(
              "tests/test_publish_trigger.py",
              'assert text.count("best_effort=True") == 2',
              'assert text.count("best_effort=True") == 3',
          )
          replace_once(
              "tests/test_publish_trigger.py",
              'text.index("proof = self._render_existing_proof")',
              'text.index("proof = self._post_commit_proof")',
          )
          replace_once(
              "tests/test_publish_trigger.py",
              '"manifest = self._render_release_manifest"',
              '"manifest = self._post_commit_manifest"',
          )

          replace_once(
              "tests/test_repository_safety.py",
              'assert lifecycle.count("best_effort=True") == 2',
              'assert lifecycle.count("best_effort=True") == 3',
          )
          replace_once(
              "tests/test_repository_safety.py",
              '    assert "persist_scheduler_history" in lifecycle\n',
              '    assert "persist_scheduler_history" in lifecycle\n    assert "persist_production_metrics" in lifecycle\n',
          )

          english = Path("docs/quickstart.md")
          text = english.read_text(encoding="utf-8")
          if "## Compatibility safety contract" not in text:
              text += '''\n## Compatibility safety contract\n\nThe established browsing scheduler contract remains explicit: **3/3** successful live samples is Stable and **2/3** is Reserve. Private scheduler history continues to use **HMAC-SHA256** fingerprints and cannot promote a current live-failed node. OpenAI, Claude, and Gemini remain independently qualified. Manual recovery still uses **Roll back production config** with **confirm = true**, validates every stable core in **tools/mihomo-versions.json**, resolves **previous-release-v1**, and applies the **current-policy** audit before activation.\n'''
              english.write_text(text, encoding="utf-8")

          chinese = Path("docs/quickstart.zh-CN.md")
          text = chinese.read_text(encoding="utf-8")
          if "## 兼容性安全契约" not in text:
              text += '''\n## 兼容性安全契约\n\n既有 browsing scheduler 契约保持不变：实时探测 **3/3** 成功进入 Stable，**2/3** 成功进入 Reserve。私有 scheduler history 继续使用 **HMAC-SHA256** fingerprint，不能把当前 live-failed 节点提升回 Stable。OpenAI、Claude、Gemini 继续独立 qualification。手动恢复仍通过 **Roll back production config**，必须设置 **confirm = true**，验证 **tools/mihomo-versions.json** 中全部 stable core，解析 **previous-release-v1**，并在激活前执行 **current-policy** audit。\n'''
              chinese.write_text(text, encoding="utf-8")
          PY
      - name: Format and run targeted regression tests
        run: |
          ruff format \
            src/clash_relay/production_metrics.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_v1_contract.py \
            tests/test_publish_trigger.py \
            tests/test_repository_safety.py
          ruff check \
            src/clash_relay/production_metrics.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_v1_contract.py \
            tests/test_publish_trigger.py \
            tests/test_repository_safety.py
          pytest -q \
            tests/test_documentation.py \
            tests/test_production_metrics.py \
            tests/test_publish_trigger.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_v1_contract.py
      - name: Commit fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/clash_relay/production_metrics.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_v1_contract.py \
            tests/test_publish_trigger.py \
            tests/test_repository_safety.py \
            docs/quickstart.md \
            docs/quickstart.zh-CN.md
          git commit -m "test: close P39-P45 validation gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
