name: Prerelease compatibility observation

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerelease:
    name: Mihomo prerelease (allowed to fail)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Download and verify primary pinned prerelease asset
        run: |
          python scripts/download_mihomo.py \
            --channel prerelease \
            --output .work/bin/mihomo
      - run: python scripts/make_fixture_sources.py
      - name: Observe compatibility without publication
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.work/bin/mihomo
        run: |
          clash-relay build \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --mihomo-bin .work/bin/mihomo \
            --output .work/prerelease.yaml
          pytest -m integration tests/integration
