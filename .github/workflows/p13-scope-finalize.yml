name: Finalize P13-only scope

on:
  push:
    branches:
      - feat/p13-p15-transport-source-health
    paths:
      - ".github/workflows/p13-scope-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p13-p15-transport-source-health
          fetch-depth: 0
      - name: Finalize P13 implementation without P15
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          remove_lines = {
              '- P15 adds a fail-closed source-health guard that compares the fully qualified candidate with the currently published private configuration before the previous-good snapshot or production KV write.',
              '- Source-health evaluation tracks only private structural fingerprints and aggregate source/region counts; it rejects large active-source collapses and protected browsing-region disappearance without emitting node names, endpoints, credentials, subscription URLs, or traffic records.',
              '- Explicit source removal from `subscriptions.yaml` is treated as a deliberate declaration change, so P15 does not mistake planned source retirement for an outage.',
          }
          text = '\n'.join(line for line in text.splitlines() if line not in remove_lines) + '\n'
          text = text.replace(
              '- P13/P15 preserve client-owned DNS, no Fake-IP, P12 Sniffer settings, pinned ACL4SSR order, the six public selectors, browsing/AI qualification, and all `subscription_1` isolation boundaries.',
              '- P13 preserves client-owned DNS, no Fake-IP, P12 Sniffer settings, pinned ACL4SSR order, the six public selectors, browsing/AI qualification, and all `subscription_1` isolation boundaries.',
          )
          text = text.replace(
              '- If transport qualification leaves no safe automatic UDP inventory, or if source-health drift crosses the production thresholds, publication stops before Cloudflare KV is replaced and previous-good remains intact.',
              '- If transport qualification leaves no safe automatic UDP inventory, publication stops before Cloudflare KV is replaced and previous-good remains intact.',
          )
          if 'P15' in text.split('## [1.3.0]', 1)[0]:
              raise SystemExit('P15 reference remains in v1.4.0 changelog section')
          changelog.write_text(text, encoding='utf-8')

          script = Path('scripts/qualify_browsing.py')
          text = script.read_text(encoding='utf-8')
          import_marker = 'from clash_relay.scheduler_policy import (\n    load_scheduler_policy,\n    preferred_stable_names_from_policy,\n)\n'
          transport_import = (
              import_marker
              + 'from clash_relay.transport_qualification import (\n'
              + '    probe_transport_nodes,\n'
              + '    rewrite_transport_qualified_candidate,\n'
              + ')\n'
          )
          if 'from clash_relay.transport_qualification import' not in text:
              if import_marker not in text:
                  raise SystemExit('qualify_browsing import marker not found')
              text = text.replace(import_marker, transport_import, 1)

          print_marker = '        print(\n            json.dumps(\n                {\n                    "status": "qualified",\n'
          transport_block = (
              '        transport_diagnostics: dict[str, object] = {}\n'
              '        tcp_qualified, udp_qualified, _ = probe_transport_nodes(\n'
              '            args.mihomo_bin,\n'
              '            args.candidate,\n'
              '            diagnostics=transport_diagnostics,\n'
              '        )\n'
              '        transport_report = rewrite_transport_qualified_candidate(\n'
              '            args.candidate,\n'
              '            tcp_qualified,\n'
              '            udp_qualified,\n'
              '        )\n\n'
              + print_marker
          )
          if 'transport_diagnostics: dict[str, object]' not in text:
              if print_marker not in text:
                  raise SystemExit('qualify_browsing output marker not found')
              text = text.replace(print_marker, transport_block, 1)

          scheduler_marker = '                    "scheduler_history": scheduler_report,\n                    **report,\n'
          scheduler_replacement = (
              '                    "scheduler_history": scheduler_report,\n'
              '                    "transport_qualification": {\n'
              '                        "diagnostics": transport_diagnostics,\n'
              '                        **transport_report,\n'
              '                    },\n'
              '                    **report,\n'
          )
          if '"transport_qualification": {' not in text:
              if scheduler_marker not in text:
                  raise SystemExit('qualify_browsing scheduler marker not found')
              text = text.replace(scheduler_marker, scheduler_replacement, 1)
          script.write_text(text, encoding='utf-8')

          test = Path('tests/test_transport_qualification.py')
          text = test.read_text(encoding='utf-8')
          marker = '    assert int.from_bytes(payload[1:5], "big") == 0x0A0A0A0A\n'
          addition = (
              marker
              + '    assert payload[5] == 8\n'
              + '    assert payload[6:14] == b"p13dcid1"\n'
              + '    assert payload[14] == 8\n'
              + '    assert payload[15:23] == b"p13scid1"\n'
          )
          if 'payload[6:14]' not in text:
              if marker not in text:
                  raise SystemExit('QUIC test marker not found')
              text = text.replace(marker, addition, 1)
          test.write_text(text, encoding='utf-8')
          PY
          rm -f scripts/qualify_transport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md scripts/qualify_browsing.py scripts/qualify_transport.py tests/test_transport_qualification.py
          git commit -m "feat: complete P13 transport qualification"
          git push origin HEAD:feat/p13-p15-transport-source-health
