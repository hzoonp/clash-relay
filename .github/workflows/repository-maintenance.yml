name: Branch janitor

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["HEAD_REF"]
          url = (
              f"https://api.github.com/repos/{repository}/git/refs/heads/"
              f"{urllib.parse.quote(branch, safe='/')}"
          )
          request = urllib.request.Request(
              url,
              method="DELETE",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "clash-relay-branch-janitor",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  if response.status != 204:
                      raise SystemExit(f"unexpected branch deletion status: {response.status}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          PY
