name: Temporary strict ACL4SSR test Ruff preview

on:
  push:
    branches:
      - fix/strict-acl4ssr-semantics

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Show Ruff formatter diff
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests/test_acl4ssr.py
          git diff -- tests/test_acl4ssr.py
