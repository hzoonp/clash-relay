name: Format stabilization branch once

on:
  push:
    branches:
      - feat/p39-p45-production-stabilization
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Apply exact locked Ruff formatting
        run: |
          ruff format \
            scripts/audit_architecture_contract.py \
            scripts/publish_production_metrics.py \
            scripts/publish_scheduler_history.py \
            src/clash_relay/policy_document.py \
            src/clash_relay/production_lifecycle.py \
            src/clash_relay/production_metrics.py \
            src/clash_relay/qualification_pipeline.py \
            src/clash_relay/qualification_reliability.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_p44_fork_ux.py
          git diff --check
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_architecture_contract.py \
            scripts/publish_production_metrics.py \
            scripts/publish_scheduler_history.py \
            src/clash_relay/policy_document.py \
            src/clash_relay/production_lifecycle.py \
            src/clash_relay/production_metrics.py \
            src/clash_relay/qualification_pipeline.py \
            src/clash_relay/qualification_reliability.py \
            tests/test_p43_chaos_matrix.py \
            tests/test_p44_fork_ux.py
          git commit -m "style: apply locked Ruff formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
