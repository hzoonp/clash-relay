name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration" --junitxml=.work/unit-${{ matrix.python }}.xml
      - run: python scripts/repository_audit.py

  deterministic-generation:
    name: Deterministic fictional generation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - run: python scripts/make_fixture_sources.py
      - name: Generate twice and compare bytes
        run: |
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --report .work/first.json
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/second.yaml
          cmp .work/first.yaml .work/second.yaml
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --check

  stable-mihomo:
    name: Mihomo ${{ matrix.tag }}
    needs: deterministic-generation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v1.19.30, v1.19.29]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Download and verify official Mihomo asset
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --tag "${{ matrix.tag }}" \
            --output .work/bin/mihomo
      - run: python scripts/make_fixture_sources.py
      - name: Generate, core-validate, then write
        run: |
          clash-relay build \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --services services.yaml \
            --policies policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --mihomo-bin .work/bin/mihomo \
            --output .work/config.yaml \
            --report .work/build.json
      - name: Real startup and provider HEAD integration tests
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.work/bin/mihomo
        run: pytest -m integration tests/integration --junitxml=.work/integration-${{ matrix.tag }}.xml

  formatting-remediation:
    name: One-time Ruff remediation
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/initial-verification
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - name: Apply reviewed lint fixes and remove this one-time job
        shell: bash
        run: |
          ruff check --fix --unsafe-fixes . || true
          ruff format .
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/repository_audit.py")
          lines = path.read_text().splitlines(keepends=True)
          index = next(i for i, line in enumerate(lines) if 'if relative in {Path("config.example.yaml"), Path("subscriptions.example.yaml")}:' in line)
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          assert lines[index + 1].strip() == 'if "external-controller:" in text or "secret:" in text:'
          assert lines[index + 2].strip() == 'failures.append(f"private controller material found in {relative}")'
          lines[index : index + 3] = [
              indent + 'if relative in {Path("config.example.yaml"), Path("subscriptions.example.yaml")} and (\n',
              indent + '    "external-controller:" in text or "secret:" in text\n',
              indent + '):\n',
              indent + '    failures.append(f"private controller material found in {relative}")\n',
          ]
          path.write_text("".join(lines))

          path = Path("src/clash_relay/validator.py")
          lines = path.read_text().splitlines(keepends=True)
          index = next(i for i, line in enumerate(lines) if line.strip() == 'if isinstance(proxy, dict) and "dialer-proxy" in proxy:')
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          assert lines[index + 1].strip() == 'if proxy["dialer-proxy"] not in group_names:'
          assert lines[index + 2].strip() == 'errors.append('
          message = lines[index + 3].strip()
          assert 'dialer-proxy references an unknown group' in message
          assert lines[index + 4].strip() == ')'
          lines[index : index + 5] = [
              indent + 'if (\n',
              indent + '    isinstance(proxy, dict)\n',
              indent + '    and "dialer-proxy" in proxy\n',
              indent + '    and proxy["dialer-proxy"] not in group_names\n',
              indent + '):\n',
              indent + '    errors.append(\n',
              indent + '        ' + message + '\n',
              indent + '    )\n',
          ]
          path.write_text("".join(lines))

          path = Path("tests/test_config_loader.py")
          text = path.read_text()
          if 'match="direct.yaml"' not in text:
              raise SystemExit("config-loader remediation target not found")
          path.write_text(text.replace('match="direct.yaml"', 'match=r"direct\\.yaml"'))

          path = Path("tests/test_status_and_security.py")
          lines = path.read_text().splitlines(keepends=True)
          import_index = next(i for i, line in enumerate(lines) if line.startswith("from clash_relay.errors import "))
          if "ConfigurationError" not in lines[import_index]:
              lines[import_index] = lines[import_index].replace("import ", "import ConfigurationError, ", 1)
          raise_index = next(i for i, line in enumerate(lines) if line.strip() == "with pytest.raises(Exception):")
          lines[raise_index] = lines[raise_index].replace("Exception", "ConfigurationError")
          path.write_text("".join(lines))

          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          marker = "\n  formatting-remediation:\n"
          if marker not in text:
              raise SystemExit("one-time remediation marker not found")
          path.write_text(text.split(marker, 1)[0] + "\n")
          PY
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
          pytest -q -m "not integration"
          python scripts/repository_audit.py
          git diff --check
      - name: Commit deterministic remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Ruff formatting and lint fixes"
          git push origin HEAD:ci/initial-verification
