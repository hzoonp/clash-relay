name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_main_validation:
        description: Reuse a successful full publish push validation for this exact main SHA
        required: false
        default: false
        type: boolean
    outputs:
      validated_sha:
        description: Exact commit SHA that completed every required validation gate
        value: ${{ jobs.validated.outputs.sha }}

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Python 3.12 quality
    if: ${{ !inputs.reuse_main_validation }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify fork public readiness
        run: clash-relay doctor --public-only
      - name: Audit public and architecture contracts
        run: python scripts/run_project_checks.py audit
      - name: Verify Routing V2 drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          python scripts/routing_shadow.py \
            --config config.yaml \
            --subscriptions subscriptions.yaml \
            --policies policies.yaml \
            > .work/routing-v2-drift.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".work/routing-v2-drift.json").read_text(encoding="utf-8"))
          if data["status"] != "healthy":
              raise SystemExit("Routing V2 configuration drift detected")
          PY
      - run: ruff check .
      - name: Ruff formatter diagnostic
        run: |
          ruff format --diff .
          ruff format --check .
      - name: Static type gate for core and application boundaries
        run: python scripts/run_project_checks.py typecheck
      - name: Unit tests and coverage floor
        run: |
          pytest -m "not integration" \
            --cov=clash_relay \
            --cov-fail-under=75 \
            --cov-report=term-missing \
            --cov-report=xml:.work/coverage-3.12.xml \
            --junitxml=.work/unit-3.12.xml
      - name: Enforce risk-based coverage ratchet
        run: python scripts/audit_risk_coverage.py .work/coverage-3.12.xml
      - name: Build and smoke the installed wheel outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir .work/wheels .
          python -m venv .work/wheel-venv
          .work/wheel-venv/bin/python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          .work/wheel-venv/bin/python -m pip install --no-deps .work/wheels/*.whl
          smoke_dir="$(mktemp -d)"
          cp config.yaml subscriptions.yaml policies.yaml "$smoke_dir/"
          cp -R policies rules "$smoke_dir/"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.work/wheel-venv/bin/clash-relay" --help >/dev/null
          "$GITHUB_WORKSPACE/.work/wheel-venv/bin/clash-relay" doctor --public-only \
            --mihomo-manifest "$GITHUB_WORKSPACE/tools/mihomo-versions.json" >/dev/null

  python-compat:
    name: Python ${{ matrix.python }} compatibility
    if: ${{ !inputs.reuse_main_validation }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Run full non-integration compatibility suite
        run: |
          pytest -m "not integration" \
            --junitxml=.work/compat-${{ matrix.python }}.xml

  deterministic-generation:
    name: Deterministic fictional generation
    needs: [quality, python-compat]
    runs-on: ubuntu-latest
    outputs:
      mihomo_tags: ${{ steps.versions.outputs.tags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - id: versions
        name: Export pinned stable Mihomo matrix
        run: python scripts/export_mihomo_matrix.py --channel stable --github-output "$GITHUB_OUTPUT"
      - name: Verify pinned ACL4SSR Online fidelity
        run: python scripts/audit_acl4ssr_fidelity.py
      - run: python scripts/make_fixture_sources.py
      - name: Generate twice and compare bytes
        run: |
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --report .work/first.json
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/second.yaml
          cmp .work/first.yaml .work/second.yaml
          clash-relay generate \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --output .work/first.yaml \
            --check

  stable-mihomo:
    name: Mihomo ${{ matrix.tag }}
    needs: deterministic-generation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.deterministic-generation.outputs.mihomo_tags) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Download and verify official Mihomo asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/download_mihomo.py \
            --channel stable \
            --tag "${{ matrix.tag }}" \
            --output .work/bin/mihomo
      - run: python scripts/make_fixture_sources.py
      - name: Generate, core-validate, then write
        run: |
          clash-relay build \
            --config tests/fixtures/project/config.yaml \
            --subscriptions tests/fixtures/project/subscriptions.yaml \
            --policies tests/fixtures/project/policies.yaml \
            --secret-file .work/fixture-secrets.yaml \
            --mihomo-bin .work/bin/mihomo \
            --output .work/config.yaml \
            --report .work/build.json
      - name: Real startup and provider HEAD integration tests
        env:
          MIHOMO_BIN: ${{ github.workspace }}/.work/bin/mihomo
        run: |
          pytest -m integration tests/integration tests/test_acl4ssr_region_omission.py \
            --ignore=tests/integration/test_acl4ssr_upstream.py \
            --junitxml=.work/integration-${{ matrix.tag }}.xml
          for attempt in 1 2 3; do
            if pytest -m integration tests/integration/test_acl4ssr_upstream.py \
              --junitxml=.work/integration-acl4ssr-${{ matrix.tag }}.xml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$attempt"
          done

  routing-required:
    name: Verify finalized Routing V2 graph
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Confirm embedded Routing V2 drift gate passed
        run: echo "Routing V2 drift is enforced by the Python 3.12 quality job."

  trusted-main:
    name: Trust validated main SHA
    if: ${{ inputs.reuse_main_validation }}
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.trust.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: trust
        name: Resolve successful full validation for exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python3 scripts/resolve_validated_sha.py --github-output "$GITHUB_OUTPUT"

  validated:
    name: Validate exact commit / Validated SHA
    needs:
      [quality, python-compat, deterministic-generation, stable-mihomo, routing-required, trusted-main]
    if: >-
      ${{ !cancelled() &&
        ((inputs.reuse_main_validation && needs.trusted-main.result == 'success') ||
        (!inputs.reuse_main_validation &&
        needs.deterministic-generation.result == 'success' &&
        needs.stable-mihomo.result == 'success' &&
        needs.routing-required.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        name: Bind validation result to exact commit SHA
        env:
          REUSE_VALIDATION: ${{ inputs.reuse_main_validation }}
          TRUSTED_SHA: ${{ needs.trusted-main.outputs.validated_sha }}
        run: |
          set -euo pipefail
          if [ "$REUSE_VALIDATION" = "true" ]; then
            sha="$TRUSTED_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          test "$sha" = "$GITHUB_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
