name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact commit
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  format-diff:
    name: Temporary formatter diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development tools
        run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - name: Show exact Ruff diff
        run: |
          ruff format --diff src/clash_relay/promotion_guard.py
          exit 1
