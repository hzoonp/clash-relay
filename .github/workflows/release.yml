name: Release source baseline

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "docs/versioning.md"
      - "rules/**"
      - "src/clash_relay/acl4ssr_reference.py"
      - "scripts/audit_acl4ssr_fidelity.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clash-relay-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and create source-only release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock --editable .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"
      - run: python scripts/repository_audit.py
      - name: Verify pinned ACL4SSR Online fidelity
        run: python scripts/audit_acl4ssr_fidelity.py
      - id: version
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify changelog release section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          marker = f'## [{version}]'
          if marker not in text:
              raise SystemExit(f'CHANGELOG.md does not contain {marker}')
          PY
      - id: existing
        name: Detect existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Render public release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith(f'## [{version}]'))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## [')), len(lines))
          body = '\n'.join(lines[start + 1:end]).strip() + '\n'
          Path('.release-notes.md').write_text(body, encoding='utf-8')
          PY
      - name: Create source-only GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file .release-notes.md
      - name: Record release status
        run: |
          echo "Release tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source-only release: production config and private scheduler state are not release assets." >> "$GITHUB_STEP_SUMMARY"
