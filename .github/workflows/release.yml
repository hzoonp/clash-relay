name: Release source baseline

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "docs/releases/**"
      - "docs/versioning.md"
      - "rules/**"
      - "src/clash_relay/acl4ssr_reference.py"
      - "scripts/audit_acl4ssr_fidelity.py"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clash-relay-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release SHA
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  production-preflight-diagnostic:
    name: Production preflight diagnostic
    needs: validate
    if: needs.validate.outputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-verified runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py
      - name: Run read-only production preflight and expose aggregate guard report
        shell: bash
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
          CLASH_RELAY_VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set +e
          python scripts/run_production_release.py --production-preflight
          status=$?
          set -e

          if [ -f .work/private/promotion-guard.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(".work/private/promotion-guard.json").read_text(encoding="utf-8"))
          safe = {
              "status": report.get("status"),
              "reason": report.get("reason"),
              "candidate": report.get("candidate"),
              "baseline": report.get("baseline"),
              "ratios": report.get("ratios"),
              "thresholds": report.get("thresholds"),
              "violations": report.get("violations"),
          }
          print("PROMOTION_GUARD_DIAGNOSTIC=" + json.dumps(safe, sort_keys=True))
          PY
            if [ -f .work/private/promotion-guard.md ]; then
              cat .work/private/promotion-guard.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          exit "$status"

  release:
    name: Create source-only release
    needs: validate
    if: needs.validate.outputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - id: version
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify versioned release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          test -f "$notes"
          grep -Fq "# clash-relay ${VERSION}" "$notes"
      - id: existing
        name: Detect existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Render public release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "docs/releases/${VERSION}.md" .release-notes.md
      - name: Create source-only GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file .release-notes.md
      - name: Record release status
        run: |
          echo "Release tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality authority: reusable ci.yml on exact commit ${{ needs.validate.outputs.validated_sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Source-only release: production config and private scheduler state are not release assets." >> "$GITHUB_STEP_SUMMARY"
