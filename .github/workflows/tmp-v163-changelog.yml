name: Temporary v1.6.3 changelog update

on:
  push:
    branches:
      - p25.1-qualification-status-hotfix
    paths:
      - .github/workflows/tmp-v163-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p25.1-qualification-status-hotfix
      - name: Add v1.6.3 changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n"
          entry = """
          ## [1.6.3] - 2026-09-03

          ### Fixed

          - P25.1 keeps the unified qualification stage protocol status fixed at `passed` after successful OpenAI client-path hardening, while preserving the hardener's operation result separately as `runtime_status`.
          - Regression coverage now prevents runtime metadata from overriding the top-level pipeline success contract used by production publication.

          ### Security

          - This hotfix does not change OpenAI route locking, normal TLS certificate and hostname verification, source isolation, client-owned DNS, stable-first client fallback, or any of the six public routing scenarios.
          """.lstrip()
          if "## [1.6.3] - 2026-09-03" not in text:
              if marker not in text:
                  raise SystemExit("Unreleased marker missing")
              text = text.replace(marker, marker + "\n" + entry + "\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit changelog
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add v1.6.3 hotfix changelog"
          git push origin HEAD:p25.1-qualification-status-hotfix
