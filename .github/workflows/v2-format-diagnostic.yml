name: v2 Format Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_v2_release_contract.py"
      - "tests/test_release_engineering.py"
      - "tests/test_v2_fresh_fork.py"
      - ".github/workflows/v2-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-verified development dependencies
        run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-dev.lock
      - name: Show exact Ruff formatting diff
        run: ruff format --diff scripts/audit_v2_release_contract.py tests/test_release_engineering.py tests/test_v2_fresh_fork.py
