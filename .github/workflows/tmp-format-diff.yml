name: Temporary Ruff Format Diff

on:
  push:
    branches:
      - work/lifecycle-result-contract

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.14.10
      - name: Show formatter diff without changing files
        run: ruff format --diff . || true
