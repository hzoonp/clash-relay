name: Self-hosted three-carrier probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-relay-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate carrier probe executor SHA
    if: github.ref == 'refs/heads/main' && vars.CLASH_RELAY_CARRIER_PROBE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  telecom:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CLASH_RELAY_CARRIER_PROBE_ENABLED == 'true' && needs.validate.outputs.validated_sha == github.sha
    runs-on: [self-hosted, linux, carrier-probe-telecom]
    timeout-minutes: 15
    environment: carrier-probe-telecom
    outputs:
      aggregate: ${{ steps.probe.outputs.aggregate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py
      - name: Probe Telecom endpoints
        id: probe
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_CARRIER_HMAC_KEY: ${{ secrets.CLASH_RELAY_CARRIER_HMAC_KEY }}
          CLASH_RELAY_CARRIER_PROBE_ENABLED: "true"
          CLASH_RELAY_CARRIER_PROBE_NETWORK: telecom
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/telecom-carrier-aggregate.json"
          trap 'rm -f "$output"' EXIT
          python scripts/run_carrier_probe.py --carrier telecom --output "$output"
          python - "$output" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              value = json.load(stream)
          print("aggregate=" + json.dumps(value, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY

  unicom:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CLASH_RELAY_CARRIER_PROBE_ENABLED == 'true' && needs.validate.outputs.validated_sha == github.sha
    runs-on: [self-hosted, linux, carrier-probe-unicom]
    timeout-minutes: 15
    environment: carrier-probe-unicom
    outputs:
      aggregate: ${{ steps.probe.outputs.aggregate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py
      - name: Probe Unicom endpoints
        id: probe
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_CARRIER_HMAC_KEY: ${{ secrets.CLASH_RELAY_CARRIER_HMAC_KEY }}
          CLASH_RELAY_CARRIER_PROBE_ENABLED: "true"
          CLASH_RELAY_CARRIER_PROBE_NETWORK: unicom
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/unicom-carrier-aggregate.json"
          trap 'rm -f "$output"' EXIT
          python scripts/run_carrier_probe.py --carrier unicom --output "$output"
          python - "$output" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              value = json.load(stream)
          print("aggregate=" + json.dumps(value, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY

  mobile:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CLASH_RELAY_CARRIER_PROBE_ENABLED == 'true' && needs.validate.outputs.validated_sha == github.sha
    runs-on: [self-hosted, linux, carrier-probe-mobile]
    timeout-minutes: 15
    environment: carrier-probe-mobile
    outputs:
      aggregate: ${{ steps.probe.outputs.aggregate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py
      - name: Probe Mobile endpoints
        id: probe
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_CARRIER_HMAC_KEY: ${{ secrets.CLASH_RELAY_CARRIER_HMAC_KEY }}
          CLASH_RELAY_CARRIER_PROBE_ENABLED: "true"
          CLASH_RELAY_CARRIER_PROBE_NETWORK: mobile
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/mobile-carrier-aggregate.json"
          trap 'rm -f "$output"' EXIT
          python scripts/run_carrier_probe.py --carrier mobile --output "$output"
          python - "$output" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              value = json.load(stream)
          print("aggregate=" + json.dumps(value, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY

  collect:
    needs: [validate, telecom, unicom, mobile]
    if: needs.validate.outputs.validated_sha == github.sha && needs.telecom.result == 'success' && needs.unicom.result == 'success' && needs.mobile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: carrier-probe-collector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false
      - name: Verify validated checkout identity
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Validate, merge, and preflight aggregate evidence
        env:
          TELECOM_AGGREGATE: ${{ needs.telecom.outputs.aggregate }}
          UNICOM_AGGREGATE: ${{ needs.unicom.outputs.aggregate }}
          MOBILE_AGGREGATE: ${{ needs.mobile.outputs.aggregate }}
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_CARRIER_HMAC_KEY: ${{ secrets.CLASH_RELAY_CARRIER_HMAC_KEY }}
          CLASH_RELAY_VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: |
          set -euo pipefail
          telecom="$RUNNER_TEMP/telecom.json"
          unicom="$RUNNER_TEMP/unicom.json"
          mobile="$RUNNER_TEMP/mobile.json"
          merged="$RUNNER_TEMP/carrier-qualification.json"
          receipt=".work/carrier-observation-receipt.json"
          trap 'rm -f "$telecom" "$unicom" "$mobile" "$merged"' EXIT
          printf '%s' "$TELECOM_AGGREGATE" > "$telecom"
          printf '%s' "$UNICOM_AGGREGATE" > "$unicom"
          printf '%s' "$MOBILE_AGGREGATE" > "$mobile"
          python scripts/collect_carrier_probes.py --input "$telecom" --input "$unicom" --input "$mobile" --output "$merged"
          python scripts/run_production_release.py --production-preflight --carrier-qualification-input "$merged"
          test -s "$receipt"

      - name: Persist carrier observation history
        if: success()
        env:
          CLASH_RELAY_CARRIER_HMAC_KEY: ${{ secrets.CLASH_RELAY_CARRIER_HMAC_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
          CLASH_RELAY_VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          python scripts/persist_carrier_observation.py --root . --receipt .work/carrier-observation-receipt.json

      - name: Remove local carrier evidence
        if: always()
        run: |
          set -euo pipefail
          rm -f .work/carrier-observation-receipt.json
