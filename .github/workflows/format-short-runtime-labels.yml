name: Format short runtime label patch

on:
  push:
    branches:
      - feat/short-runtime-source-labels
    paths:
      - .github/workflows/format-short-runtime-labels.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/short-runtime-source-labels
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - name: Apply repository formatter
        run: ruff format src/clash_relay/routing_policy.py
      - name: Commit formatted patch
        run: |
          rm .github/workflows/format-short-runtime-labels.yml
          git config user.name "hzoonp"
          git config user.email "59133798+hzoonp@users.noreply.github.com"
          git add -A
          git commit -m "style: format runtime source isolation"
          git push origin HEAD:feat/short-runtime-source-labels
