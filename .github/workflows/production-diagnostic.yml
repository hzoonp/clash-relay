name: Safe production diagnostic

on:
  push:
    branches:
      - diag/prod-stage-0586c807
    paths:
      - ".github/workflows/production-diagnostic.yml"
      - "scripts/diagnose_production_release.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Mask individual subscription URLs
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
        run: python scripts/mask_subscription_secrets.py
      - name: Run safe production dry-run trace
        env:
          CLASH_RELAY_SUBSCRIPTIONS: ${{ secrets.CLASH_RELAY_SUBSCRIPTIONS }}
          CLASH_RELAY_SCHEDULE_PUBLISH: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_TITLE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_TITLE }}
        run: python scripts/diagnose_production_release.py
