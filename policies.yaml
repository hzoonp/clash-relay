version: 1

scheduler:
  browsing:
    attempts: 3
    reserve_successes: 2
    region_switch_interval: 300
  history:
    min_runs: 2
    min_success_ema: 0.8
    max_age_seconds: 2592000
  ai_cache:
    pass_ttl_seconds: 21600
    failure_ttl_seconds: 3600

# Routing V2 keeps classification, source permissions, service qualification,
# region policy, and scheduling as separate dimensions. Browsing owns an
# independent regional preference order so web egress stays in one region until
# that region is unavailable; AI keeps its own service-specific region policy.
routing:
  version: 2
  scenarios:
    direct: {source_use: general, scheduler_profile: direct}
    general: {source_use: general, scheduler_profile: connectivity}
    browsing: {source_use: browsing, scheduler_profile: browsing}
    media: {source_use: general, scheduler_profile: media}
    download: {source_use: general, scheduler_profile: download}
    ai: {source_use: ai, scheduler_profile: ai}
    final: {source_use: general, scheduler_profile: connectivity}
  browsing:
    preferred_regions: [US, SG, JP, TW, KR, HK, OTHER]
  ai:
    excluded_regions: [HK]
    preferred_regions: [US, SG, JP, TW, KR, OTHER]
  download:
    mode: general_auto

capabilities:
  general:
    description: Ordinary egress suitable for ACL4SSR-managed routing.
    restricted: false

cost_levels: [standard]

country_classification:
  default: OTHER
  aliases:
    HK:
      - '(?i)(香港|Hong ?Kong|HKG|🇭🇰)'
      - '(?i)(^|[^A-Za-z])HK([^A-Za-z]|$)'
    TW:
      - '(?i)(台湾|臺灣|台北|Taiwan|Taipei|TPE|🇹🇼)'
      - '(?i)(^|[^A-Za-z])TW([^A-Za-z]|$)'
    SG:
      - '(?i)(新加坡|狮城|獅城|Singapore|SIN|🇸🇬)'
      - '(?i)(^|[^A-Za-z])SG([^A-Za-z]|$)'
    JP:
      - '(?i)(日本|东京|東京|大阪|Japan|Tokyo|Osaka|NRT|KIX|🇯🇵)'
      - '(?i)(^|[^A-Za-z])JP([^A-Za-z]|$)'
    US:
      - '(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯|United ?States|Los ?Angeles|San ?Jose|Seattle|New ?York|Dallas|LAX|SJC|SEA|JFK|DFW|🇺🇸)'
      - '(?i)(^|[^A-Za-z])USA?([^A-Za-z]|$)'
    KR:
      - '(?i)(韩国|韓國|首尔|首爾|Korea|Seoul|ICN|🇰🇷)'
      - '(?i)(^|[^A-Za-z])KR([^A-Za-z]|$)'

probes:
  connectivity:
    url: https://www.gstatic.com/generate_204
    method: HEAD
    expected_status: "204"
    interval: 300
    timeout: 5000
    lazy: true
    tolerance: 50
  browsing:
    url: https://www.gstatic.com/generate_204
    method: HEAD
    expected_status: "204"
    interval: 180
    timeout: 3000
    lazy: false
    tolerance: 150
  ai_openai:
    url: https://chatgpt.com/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50
  ai_claude:
    url: https://claude.ai/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50
  ai_gemini:
    url: https://gemini.google.com/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50

pools:
  - id: general
    display_name: __CR_GENERAL_INVENTORY
    module: general
    source_use: general
    regions: [ANY]
    fallback_order: [ANY]
    capabilities_any: [general]
    capabilities_all: []
    excluded_capabilities: []
    allowed_cost_levels: [standard]
    on_empty: error
    probe: connectivity
    rule_priority: 1000
    rules: null

  - id: browsing
    display_name: __CR_BROWSING_INVENTORY
    module: general
    source_use: browsing
    regions: [US, SG, JP, TW, KR, HK, OTHER]
    fallback_order: [US, SG, JP, TW, KR, HK, OTHER]
    capabilities_any: [general]
    capabilities_all: []
    excluded_capabilities: []
    allowed_cost_levels: [standard]
    on_empty: error
    probe: browsing
    rule_priority: 1010
