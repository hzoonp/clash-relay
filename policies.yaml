version: 1

scheduler:
  browsing:
    attempts: 3
    reserve_successes: 2
    region_switch_interval: 300
  history:
    min_runs: 2
    min_success_ema: 0.8
    recover_success_ema: 0.9
    demote_after_failures: 2
    max_age_seconds: 2592000
  ai_cache:
    pass_ttl_seconds: 21600
    failure_ttl_seconds: 3600

# Routing V2 keeps classification, source permissions, service qualification,
# region policy, and scheduling as separate dimensions. Browsing owns an
# independent regional preference order so web egress stays in one region until
# that region is unavailable; AI keeps its own service-specific region policy.
routing:
  version: 2
  scenarios:
    direct: {source_use: general, scheduler_profile: direct}
    general: {source_use: general, scheduler_profile: connectivity}
    browsing: {source_use: browsing, scheduler_profile: browsing}
    media: {source_use: general, scheduler_profile: media}
    download: {source_use: general, scheduler_profile: download}
    ai: {source_use: ai, scheduler_profile: ai}
    final: {source_use: general, scheduler_profile: connectivity}
  browsing:
    preferred_regions: [US, SG, JP, TW, KR, HK, OTHER]
  ai:
    excluded_regions: [HK]
    preferred_regions: [US, SG, JP, TW, KR, OTHER]
  download:
    mode: general_auto
  # P15: names/fidelity rules are data, not Python constants. Forks can replace
  # this block while the compiler/audits remain generic.
  contract:
    public_groups:
      general: 代理选择
      browsing: 网页浏览
      ai: 人工智能
      media: 流媒体
      messaging: 消息通讯
      download: 下载流量
    automatic_groups:
      media: 媒体自动
      messaging: 通讯自动
      download: 下载自动
    general_region_choices:
      - 香港节点
      - 台湾节点
      - 新加坡节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - DIRECT
    compatibility_selectors:
      全球直连: [DIRECT, 代理选择, 自动选择]
      广告拦截: [REJECT, DIRECT]
      谷歌FCM: [代理选择, 全球直连, 自动选择]
      微软服务: [全球直连, 代理选择]
      苹果服务: [代理选择, 全球直连]
      漏网之鱼: [代理选择, 全球直连, 自动选择]
    disabled_groups: [应用净化]
    ai:
      service_targets:
        openai: __CR_AI_SERVICE_OPENAI
        claude: __CR_AI_SERVICE_CLAUDE
        gemini: __CR_AI_SERVICE_GEMINI
      service_prefixes:
        openai: __CR_AI_OPENAI_
        claude: __CR_AI_CLAUDE_
        gemini: __CR_AI_GEMINI_
      region_display_names:
        HK: [AI · 香港, AI · HK]
        TW: [AI · 台湾, AI · TW]
        SG: [AI · 新加坡, AI · SG]
        JP: [AI · 日本, AI · JP]
        US: [AI · 美国, AI · US]
        KR: [AI · 韩国, AI · KR]
        OTHER: [AI · 其他地区, AI · OTHER]
      required_excluded_regions: [HK]
    binding_targets:
      telegram: 消息通讯
      ai: 人工智能
      openai: 人工智能
      proxy_media: 流媒体
      download: 下载流量
      proxy_lite: 网页浏览
      china_domain: 全球直连
      china_company_ip: 全球直连
      geoip_cn: 全球直连
    priority_edges:
      - [telegram, ai]
      - [telegram, openai]
      - [ai, proxy_media]
      - [openai, proxy_media]
      - [proxy_media, download]
      - [download, proxy_lite]
      - [proxy_lite, china_domain]
      - [china_domain, china_company_ip]
      - [china_company_ip, geoip_cn]
    acl4ssr_baseline: ProxyMedia -> ProxyLite -> ChinaDomain -> ChinaCompanyIp -> GEOIP CN
    intentional_deviations:
      - BanProgramAD disabled
      - AI extension
      - Download extension

capabilities:
  general:
    description: Ordinary egress suitable for ACL4SSR-managed routing.
    restricted: false

cost_levels: [standard]

country_classification:
  default: OTHER
  aliases:
    HK:
      - '(?i)(香港|Hong ?Kong|HKG|🇭🇰)'
      - '(?i)(^|[^A-Za-z])HK([^A-Za-z]|$)'
    TW:
      - '(?i)(台湾|臺灣|台北|Taiwan|Taipei|TPE|🇹🇼)'
      - '(?i)(^|[^A-Za-z])TW([^A-Za-z]|$)'
    SG:
      - '(?i)(新加坡|狮城|獅城|Singapore|SIN|🇸🇬)'
      - '(?i)(^|[^A-Za-z])SG([^A-Za-z]|$)'
    JP:
      - '(?i)(日本|东京|東京|大阪|Japan|Tokyo|Osaka|NRT|KIX|🇯🇵)'
      - '(?i)(^|[^A-Za-z])JP([^A-Za-z]|$)'
    US:
      - '(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯|United ?States|Los ?Angeles|San ?Jose|Seattle|New ?York|Dallas|LAX|SJC|SEA|JFK|DFW|🇺🇸)'
      - '(?i)(^|[^A-Za-z])USA?([^A-Za-z]|$)'
    KR:
      - '(?i)(韩国|韓國|首尔|首爾|Korea|Seoul|ICN|🇰🇷)'
      - '(?i)(^|[^A-Za-z])KR([^A-Za-z]|$)'

probes:
  connectivity:
    url: https://www.gstatic.com/generate_204
    method: HEAD
    expected_status: "204"
    interval: 300
    timeout: 5000
    lazy: true
    tolerance: 50
  browsing:
    url: https://www.gstatic.com/generate_204
    method: HEAD
    expected_status: "204"
    interval: 180
    timeout: 3000
    lazy: false
    tolerance: 150
  ai_openai:
    url: https://chatgpt.com/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50
  ai_claude:
    url: https://claude.ai/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50
  ai_gemini:
    url: https://gemini.google.com/
    method: HEAD
    expected_status: "200-399"
    interval: 3600
    timeout: 5000
    lazy: false
    tolerance: 50

