version: 1

capabilities:
  general:
    description: Ordinary egress suitable for ACL4SSR-managed routing.
    restricted: false

cost_levels: [standard]

country_classification:
  default: OTHER
  aliases: {}

probes:
  connectivity:
    url: https://www.gstatic.com/generate_204
    method: HEAD
    expected_status: "204"
    interval: 300
    timeout: 5000
    lazy: true
    tolerance: 50

pools:
  - id: general
    display_name: 节点选择
    module: general
    source_use: general
    regions: [ANY]
    fallback_order: [ANY]
    capabilities_any: [general]
    capabilities_all: []
    excluded_capabilities: []
    allowed_cost_levels: [standard]
    on_empty: error
    probe: connectivity
    rule_priority: 1000
    rules: null

chains: []
