    display_name: __CR_GENERAL_INVENTORY
    module: general
    source_use: general
    regions: [ANY]
    fallback_order: [ANY]
    capabilities_any: [general]
    capabilities_all: []
    excluded_capabilities: []
    allowed_cost_levels: [standard]
    on_empty: error
    probe: connectivity
    rule_priority: 1000
    rules: null

