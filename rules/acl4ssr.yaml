  - id: policy_auto
    display_name: 自动选择
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '.*'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_manual
