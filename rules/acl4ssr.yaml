# Routing targets and policy member order mirror ACL4SSR_Online_Full.ini at the
# pinned ref. FlClash hides only automatic helper groups; every actionable
# ACL4SSR select group remains visible. AI is the sole semantic extension: its
# candidate countries are live-qualified per service.
groups:
  # ACL4SSR shared selectors -------------------------------------------------
  - id: policy_auto
    display_name: 自动选择
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '.*'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_manual
    display_name: 手动切换
    module: general
    type: select
    provider_pool: general
    filter: '.*'
    members: []

  - id: policy_hk
    display_name: 香港节点
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '(港|HK|hk|Hong Kong|HongKong|hongkong)'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_tw
    display_name: 台湾节点
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '(台|新北|彰化|TW|Taiwan)'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_sg
    display_name: 新加坡节点
