# Baseline order follows pinned ACL4SSR_Online.ini. Download ingress/process
# rules precede baseline domains; confirmed download hosts and Download.list
# precede AI/OpenAI, ProxyMedia, and ProxyLite. AI/OpenAI still precede media.
# Every download classifier receives an adjacent terminal REJECT at compilation.
sources:
  - id: local_area_network
    path: Clash/LocalAreaNetwork.list
    target: 全球直连
    priority: 10
    module: general
    scenario: direct

  - id: unban
