# P10: ACL4SSR_Online.ini is the classification source of truth. clash-relay
# adapts only the user-control surface and subscription reachability. Every
# deviation from the pinned Online profile is declared here and verified in CI.
reference:
  path: Clash/config/ACL4SSR_Online.ini
  # BanProgramAD caused real mobile image/CDN breakage. Keep basic BanAD only.
  disabled_paths:
    - Clash/BanProgramAD.list
  disabled_groups:
    '🍃 应用净化': 应用净化
  target_map:
    '🎯 全球直连': 全球直连
    '🛑 全球拦截': 广告拦截
    '🍃 应用净化': 应用净化
    '📢 谷歌FCM': 谷歌FCM
    'Ⓜ️ 微软服务': 微软服务
    '🍎 苹果服务': 苹果服务
    '📲 电报信息': 消息通讯
    '🌍 国外媒体': 流媒体
    '🚀 节点选择': 网页浏览
    '🐟 漏网之鱼': 漏网之鱼
  # These compatibility selectors keep the ACL4SSR default member order exactly
  # after names are mapped into clash-relay's source-aware control surface.
  group_map:
    '♻️ 自动选择': 自动选择
    'Ⓜ️ 微软服务': 微软服务
    '🍎 苹果服务': 苹果服务
    '📢 谷歌FCM': 谷歌FCM
    '🎯 全球直连': 全球直连
    '🛑 全球拦截': 广告拦截
    '🐟 漏网之鱼': 漏网之鱼
  # These groups intentionally adapt ACL4SSR's raw-node wildcard to scenario
  # selectors so subscription_1 can never leak into general/media/download.
  adapted_groups:
    '🚀 节点选择': 代理选择
    '🌍 国外媒体': 流媒体
    '📲 电报信息': 消息通讯
  member_map:
    '🚀 节点选择': 代理选择
    '♻️ 自动选择': 自动选择
    '🎯 全球直连': 全球直连
  # Only these classification extensions may interleave with the Online baseline.
  extensions:
    - {source_id: ai, before_path: Clash/ProxyMedia.list}
    - {source_id: openai, before_path: Clash/ProxyMedia.list}
    - {source_id: download, before_path: Clash/ProxyLite.list}

groups:
