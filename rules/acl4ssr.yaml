    hidden: true
    type: url-test
    provider_pool: general
    filter: '(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    members: []

  - id: policy_kr
    display_name: 韩国节点
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '(KR|Korea|KOR|首尔|韩|韓)'
