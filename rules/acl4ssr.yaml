      - {group: 台湾节点}
      - {group: 新加坡节点}
      - {group: 日本节点}
      - {group: 美国节点}
      - {group: 韩国节点}
      - {group: 手动切换}
      - {builtin: DIRECT}

  # Deterministic runtime targets retain the pinned ACL4SSR member lists below
