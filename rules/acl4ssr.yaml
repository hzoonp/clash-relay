version: 1
repository: ACL4SSR/ACL4SSR
ref: c498ae4911f15b19c5ceaef6f8737ca8705b4430
license: CC-BY-SA-4.0
max_source_bytes: 2097152

# Production keeps the complete pinned ACL4SSR Online Full rule coverage. AI
# rules route through country-scoped candidate pools that are live-qualified on
# the trusted runner before the final candidate is validated and published.
groups:
  - id: policy_block
    display_name: 广告拦截
    module: general
    members:
      - {builtin: REJECT}
      - {builtin: DIRECT}

  - id: policy_ai
    display_name: 人工智能
    module: general
    members:
      - {group: AI · 新加坡}
      - {group: AI · 日本}
      - {group: AI · 美国}
      - {group: AI · 香港}
      - {group: AI · 台湾}
      - {group: AI · 韩国}
      - {group: AI · 其他地区}
      - {builtin: DIRECT}

  - id: policy_streaming
    display_name: 流媒体
    module: general
    excluded_sources: [subscription_1]
    members:
      - {group: 节点选择}
      - {builtin: DIRECT}

  - id: policy_domestic_services
    display_name: 国内服务
    module: general
    excluded_sources: [subscription_1]
    members:
      - {builtin: DIRECT}
      - {group: 节点选择}

# Subscription 1 is allowed only for the explicit general-web ProxyGFWlist path
# and the live-qualified AI country pools. Application-specific Telegram and
# unmatched final traffic use a hidden source-filtered anchor that excludes it.
final_target: 节点选择
final_excluded_sources: [subscription_1]

# Rule fragments mirror ACL4SSR_Online_Full.ini order, but fetch from the pinned
# immutable commit above instead of the moving master branch. Groups are
# intentionally consolidated for a compact FlClash policy UI.
