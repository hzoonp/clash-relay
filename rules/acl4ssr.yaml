    hidden: true
    type: url-test
    provider_pool: general
    filter: '(NF|奈飞|解锁|Netflix|NETFLIX|Media)'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    route:
      scenario: media
      service: netflix
      profile: media
    members: []

  - id: policy_node_selection
    display_name: 代理选择
    module: general
    route:
      scenario: general
      profile: general
    members:
      - {group: 自动选择}
