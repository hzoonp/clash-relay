# ACL4SSR still owns classification order. Routing Model V2 makes the target
# semantics explicit: scenario/service metadata is orthogonal to UI groups, and
# hidden rule targets are deterministic unless they are an automatic scheduler.
groups:
  # User-facing general scenario and helpers ---------------------------------
  - id: policy_auto
    display_name: 自动选择
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '.*'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_manual
    display_name: 手动切换
    module: general
    hidden: true
    type: select
    provider_pool: general
    filter: '.*'
    members: []

  - id: policy_browsing_auto
    display_name: 网页自动
    module: general
    hidden: true
    type: url-test
    provider_pool: browsing
    filter: '.*'
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 150
    members: []

  - id: policy_browsing
    display_name: 网页浏览
    module: general
    type: select
    provider_pool: browsing
    filter: '.*'
    route:
      scenario: browsing
      profile: browsing
    members:
      - {group: 网页自动}
      - {builtin: DIRECT}

  # Regions are scheduling dimensions under 代理选择, never top-level scenarios.
  - id: policy_hk
    display_name: 香港节点
    module: general
    hidden: true
    type: url-test
    provider_pool: general
    filter: '(港|HK|hk|Hong Kong|HongKong|hongkong)'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    members: []

  - id: policy_tw
    display_name: 台湾节点
