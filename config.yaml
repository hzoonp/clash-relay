version: 1

runtime:
  mixed_port: 7890
  allow_lan: false
  bind_address: 127.0.0.1
  mode: rule
  log_level: warning
  ipv6: false
  unified_delay: true
  tcp_concurrent: true
  profile:
    store_selected: true
    store_fake_ip: true
  dns:
    enabled: true
    enhanced_mode: fake-ip
    listen: 127.0.0.1:1053
    nameservers:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    fallback_nameservers:
      - tls://1.0.0.1:853

modules:
  general: true

generation:
  minimum_successful_subscriptions: 1
  minimum_usable_nodes: 1
  fetch_timeout_seconds: 20
  max_subscription_bytes: 8388608
  invalid_proxy_policy: error
  duplicate_policy: keep_first
  allow_http_subscription_urls: false
  allow_file_subscription_urls: false
  reject_private_proxy_hosts: true
  fail_on_required_subscription_error: true
  node_name_prefix: source_id
  generated_header: true

rule_sources:
  acl4ssr:
    enabled: true
    manifest: rules/acl4ssr.yaml

publishing:
  artifact: false
  github_release:
    enabled: false
    allow_sensitive_public_release: false
  gist:
    enabled: false
    allow_sensitive_unlisted_gist: false
  cloudflare_kv:
    enabled: true
    key: production-config
