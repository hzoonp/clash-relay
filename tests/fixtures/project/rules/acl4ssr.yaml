# Production routing follows ACL4SSR's Online Full model. The groups below are
# policy-only selectors: proxy credentials remain owned by the single Proxy pool.
groups:
  - id: policy_auto
    display_name: Auto
    module: general
    members:
      - {auto_pool: general}

  - id: policy_direct
    display_name: Direct
    module: general
    members:
      - {builtin: DIRECT}
      - {group: Proxy}
      - {group: Auto}

  - id: policy_block
    display_name: Block
    module: general
    members:
      - {builtin: REJECT}
      - {builtin: DIRECT}

  - id: policy_app_purify
