version: 1

services:
  - id: chatgpt
    display_name: ChatGPT
    module: chatgpt
    source_use: ai
    required_capabilities: [ai]
    excluded_capabilities: [residential, emby, high_multiplier, chain]
    allowed_cost_levels: [free, low, standard, premium]
    countries: [US, JP, SG, OTHER]
    fallback_order: [US, JP, SG, OTHER]
    on_empty: reject
    rule_priority: 100
    rules: rules/chatgpt.yaml
    probe:
      url: https://api.openai.com/v1/models
      method: HEAD
      expected_status: "200/401/403"
      interval: 300
      timeout: 5000
      lazy: true
      tolerance: 50

  - id: claude
    display_name: Claude
    module: claude
    source_use: ai
    required_capabilities: [ai]
    excluded_capabilities: [residential, emby, high_multiplier, chain]
    allowed_cost_levels: [free, low, standard, premium]
    countries: [US, JP, SG, OTHER]
    fallback_order: [US, JP, SG, OTHER]
    on_empty: reject
    rule_priority: 110
    rules: rules/claude.yaml
    probe:
      url: https://api.anthropic.com/v1/messages
      method: HEAD
      expected_status: "400/401/403/405"
      interval: 300
      timeout: 5000
      lazy: true
      tolerance: 50

  - id: gemini
    display_name: Gemini
    module: gemini
    source_use: ai
    required_capabilities: [ai]
    excluded_capabilities: [residential, emby, high_multiplier, chain]
    allowed_cost_levels: [free, low, standard, premium]
    countries: [US, JP, SG, OTHER]
    fallback_order: [US, JP, SG, OTHER]
    on_empty: reject
    rule_priority: 120
    rules: rules/gemini.yaml
    probe:
      url: https://generativelanguage.googleapis.com/v1beta/models
      method: HEAD
      expected_status: "200/400/401/403/405"
      interval: 300
      timeout: 5000
      lazy: true
      tolerance: 50
